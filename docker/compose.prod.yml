services:
  app:
    image: ghcr.io/ecotrust/mida-portal:${IMAGE_TAG:?IMAGE_TAG must be a pinned short SHA}
    volumes:
      - ./static:/vol/web/static
      - ./media:/usr/local/apps/madrona-portal/media
      - ./config.mida.prod.ini:/usr/local/apps/madrona-portal/apps/mida-portal/docker/config.mida.prod.ini:ro
    env_file:
      - ./.env
    environment:
      - DB_INIT=${DB_INIT:-0}
      - MP_PROJECT_CONFIG=/usr/local/apps/madrona-portal/apps/mida-portal/docker/config.mida.prod.ini
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      - DEBUG=${DEBUG:-False}
      - DB_ENGINE=${DB_ENGINE:-django.contrib.gis.db.backends.postgis}
      - DB_NAME=${DB_NAME:-mida_docker_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}tasks:6379/1
      - CELERY_BROKER_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}tasks:6379/0
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - DJANGO_ENV=${DJANGO_ENV:-production}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
    depends_on:
      db:
        condition: service_healthy
      tasks:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8001}:8008"
    networks:
      - madronanetwork
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    volumes:
      - postgis_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-mida_docker_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks:
      - madronanetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mida_docker_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tasks:
    image: redis:7-alpine
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - madronanetwork
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgis_data:
  redis_data:

networks:
  madronanetwork:
    driver: bridge
