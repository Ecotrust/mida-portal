version: '3'

vars:
  CORE: ../../madrona-portal
  COMPOSE: docker compose -f docker/compose.yml -f {{.CORE}}/docker/compose.base.yml --env-file docker/.env

tasks:
  build-base:
    aliases: [base]
    desc: Build the shared Madrona platform base image locally.
    cmds:
      - sh -c 'if [ -f docker/.env ]; then set -a; . docker/.env; set +a; fi; docker build -t ghcr.io/ecotrust/madrona-portal:${BASE_TAG:-latest} -f {{.CORE}}/docker/Dockerfile {{.CORE}}/../'

  build-portal:
    aliases: [build]
    desc: Build the MidA development image on the shared platform base.
    cmds:
      - '{{.COMPOSE}} build'

  up:
    desc: Start the MidA development stack without running database initialization.
    cmds:
      - '{{.COMPOSE}} up'

  init:
    desc: Initialize a fresh MidA database, then start the development stack.
    cmds:
      - DB_INIT=1 {{.COMPOSE}} up

  down:
    desc: Stop and remove MidA development containers and network; preserve volumes.
    cmds:
      - '{{.COMPOSE}} down'

  logs:
    desc: Follow the MidA application container logs.
    cmds:
      - '{{.COMPOSE}} logs -f app'

  manage:
    desc: Run a Django management command, e.g. task manage -- migrate.
    cmds:
      - '{{.COMPOSE}} exec app python marco/manage.py {{.CLI_ARGS}}'

  shell:
    desc: Open the Django shell in the running MidA app container.
    cmds:
      - '{{.COMPOSE}} exec app python marco/manage.py shell'